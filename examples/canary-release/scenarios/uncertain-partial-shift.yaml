apiVersion: soil.dev/v1alpha1
kind: SimScenario
metadata:
  name: uncertain-partial-shift
spec:
  description: "The traffic shift is cut off halfway and the connection drops. Soil holds downstream work, observes the partial shift, fails traffic back and rolls back."
  expect: RECOVERED
  inputs: {image: "ghcr.io/acme/checkout:3.1.0"}
  faults: {shift_traffic: [lost_after_apply, partial]}
  world:
    deployments:
      prod/checkout/api: {image: "ghcr.io/acme/checkout:3.0.4", configVersion: cfg-12, replicas: 6}
    traffic:
      prod/checkout/api: {canary: 0}
    http:
      "https://slo.test/checkout": {error_rate: 0.002, p99_ms: 140}
