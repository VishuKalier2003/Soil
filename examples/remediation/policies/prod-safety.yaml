apiVersion: soil.dev/v1alpha1
kind: Policy
metadata:
  name: prod-safety
  description: Conservative execution policy for production changes.
spec:
  allowUncertainty: false
  allowIrreversible: false
  requireVerificationAtOrAbove: medium
  requireApprovalAtOrAbove: high
  maxReconcileAttempts: 3
  constraints:
    maxReplicas: 20
    allowedRegions: [eu-west-1]
    requireVerification: true
    requireCompensation: true
    permittedAdapters: [github, kubernetes, ci, http]
    maxActionCount: 10
    maxExecutionDuration: 30m
