# inspect → modify → test → deploy → verify
#
# A compact transaction that uses every node type:
#   inspect:  two OBSERVE nodes in parallel, joined (JOIN)
#   modify:   ACTION (branch commit)
#   test:     SPLIT into unit tests ‖ lint (ACTIONs), JOIN, CHECKPOINT on their results
#   deploy:   APPROVAL, ACTION (rollout), CONDITION guarding the traffic shift
#   verify:   VERIFY (SLO) — the commit boundary
#
# The transaction can only reach COMMITTED after `verify` succeeds. Any failure runs the
# declared recovery graph: observe, restore traffic, roll back, delete the branch, verify.
apiVersion: soil.dev/v1alpha1
kind: Flow
metadata:
  name: ship-fix
  description: Ship a code fix to production and commit only after the SLO is verified.
spec:
  intent:
    summary: "Ship ${inputs.image} to ${inputs.service}"
    actor: agent:shipper
    principal: team:platform
    inputs:
      image: {required: true}
      service: {default: shop}
      branch: {default: soil/ship-fix}
      replicas: {default: 3}

  # AgentScript/Crane authorizes; Soil consumes the result for exactly this contract version.
  authority:
    provider: crane
    contractId: platform/ship-fix
    contractHash: "sha256:b1946ac92492d2347c6235b4d2611184e1a6b6c6f1d9b2b7a6e0a9b2c3d4e5f6"

  policies: [ship-fix-guardrails]

  guarantees:
    require: [compensatable, verified, reconcilable]

  adapters:
    github: {type: github, version: 1}
    k8s: {type: kubernetes, version: 1, config: {region: eu-west-1}}
    ci: {type: ci, version: 1}
    slo: {type: http, version: 1}

  execution:
    maxParallelism: 4

  nodes:
    # inspect ---------------------------------------------------------------------------------
    - {id: inspect_repo, kind: OBSERVE, label: Inspect repository, adapter: github, operation: repo.inspect, resource: "github://acme/shop", ui: {x: 0, y: 0}}
    - {id: inspect_prod, kind: OBSERVE, label: Inspect production, adapter: k8s, operation: deployment.status, resource: "k8s://prod/shop/deployment/api", ui: {x: 0, y: 140}}
    - {id: inspected, kind: JOIN, label: Inspected, ui: {x: 230, y: 70}}

    # modify ----------------------------------------------------------------------------------
    - id: modify_code
      kind: ACTION
      label: Modify code
      adapter: github
      operation: branch.commit
      resource: "github://acme/shop/branches/${inputs.branch}"
      preconditions: ['facts.inspect_repo.default_branch == "main"']
      params:
        branch: "${inputs.branch}"
        base: "${facts.inspect_repo.head_sha}"
        message: "fix: ship ${inputs.image}"
        files: {deploy/image.txt: "${inputs.image}"}
      risk: medium
      ui: {x: 460, y: 70}

    # test ------------------------------------------------------------------------------------
    - {id: test, kind: SPLIT, label: Test, ui: {x: 690, y: 70}}
    - id: unit_tests
      kind: ACTION
      label: Unit tests
      adapter: ci
      operation: job.run
      resource: "ci://generic/unit/${inputs.branch}"
      params: {job: unit, ref: "${facts.modify_code.sha}"}
      postconditions: ['observed.status == "passed"']
      ui: {x: 920, y: 0}
    - id: lint
      kind: ACTION
      label: Lint
      adapter: ci
      operation: job.run
      resource: "ci://generic/lint/${inputs.branch}"
      params: {job: lint, ref: "${facts.modify_code.sha}"}
      postconditions: ['observed.status == "passed"']
      ui: {x: 920, y: 140}
    - {id: tested, kind: JOIN, label: Tested, ui: {x: 1150, y: 70}}
    - {id: ready_to_deploy, kind: CHECKPOINT, label: Ready to deploy, ui: {x: 0, y: 320}}

    # deploy ----------------------------------------------------------------------------------
    - {id: approve, kind: APPROVAL, label: Approve deploy, risk: high, ui: {x: 230, y: 320}}
    - id: deploy
      kind: ACTION
      label: Deploy
      adapter: k8s
      operation: deployment.rollout
      resource: "k8s://prod/shop/deployment/api"
      params: {image: "${inputs.image}", replicas: "${inputs.replicas}"}
      cost: {amount: 4.5, currency: USD}
      risk: high
      ui: {x: 460, y: 320}
    - {id: canary_needed, kind: CONDITION, label: Traffic not yet shifted?, expr: "facts.inspect_prod.traffic.canary != 100", ui: {x: 690, y: 320}}
    - id: shift_traffic
      kind: ACTION
      label: Shift traffic
      adapter: k8s
      operation: traffic.shift
      resource: "k8s://prod/shop/traffic/api"
      params: {canary_weight: 100}
      risk: high
      ui: {x: 920, y: 320}

    # verify ----------------------------------------------------------------------------------
    - id: verify
      kind: VERIFY
      label: Verify SLO
      adapter: slo
      operation: get
      resource: "https://slo.test/${inputs.service}"
      checks: ["observed.error_rate < 0.01", "observed.p99_ms < 300"]
      ui: {x: 1150, y: 320}

    # recovery --------------------------------------------------------------------------------
    - {id: observe_actual, kind: OBSERVE, phase: recovery, label: Observe actual state, adapter: k8s, operation: deployment.status, resource: "k8s://prod/shop/deployment/api", ui: {x: 230, y: 560}}
    - {id: restore_traffic, kind: COMPENSATE, phase: recovery, label: Restore traffic, adapter: k8s, operation: traffic.restore, resource: "k8s://prod/shop/traffic/api", params: {canary_weight: "${target.observed.previous_canary}"}, ui: {x: 460, y: 500}}
    - {id: rollback, kind: COMPENSATE, phase: recovery, label: Roll back, adapter: k8s, operation: deployment.rollback, resource: "k8s://prod/shop/deployment/api", params: {image: "${target.observed.previous_image}"}, ui: {x: 690, y: 500}}
    - {id: verify_rollback, kind: VERIFY, phase: recovery, label: Verify rollback, adapter: k8s, operation: deployment.status, resource: "k8s://prod/shop/deployment/api", checks: ["observed.image == facts.inspect_prod.image"], ui: {x: 920, y: 500}}
    - {id: delete_branch, kind: COMPENSATE, phase: recovery, label: Delete branch, adapter: github, operation: branch.delete, resource: "github://acme/shop/branches/${inputs.branch}", params: {branch: "${target.params.branch}"}, ui: {x: 460, y: 640}}

  edges:
    - {from: inspect_repo, to: inspected, type: DEPENDS_ON}
    - {from: inspect_prod, to: inspected, type: DEPENDS_ON}
    - {from: inspected, to: modify_code, type: DEPENDS_ON}
    - {from: modify_code, to: test, type: ON_SUCCESS}
    - {from: test, to: unit_tests, type: DEPENDS_ON}
    - {from: test, to: lint, type: DEPENDS_ON}
    - {from: unit_tests, to: tested, type: DEPENDS_ON}
    - {from: lint, to: tested, type: DEPENDS_ON}
    - {from: tested, to: ready_to_deploy, type: DEPENDS_ON}
    - {from: ready_to_deploy, to: approve, type: DEPENDS_ON}
    - {from: approve, to: deploy, type: DEPENDS_ON}
    - {from: deploy, to: canary_needed, type: ON_SUCCESS}
    - {from: canary_needed, to: shift_traffic, type: GUARDS}
    - {from: verify, to: deploy, type: VERIFIES}
    # verify runs after the shift whether or not the shift was needed
    - {from: shift_traffic, to: verify, type: TRIGGERS}

    - {from: modify_code, to: observe_actual, type: ON_FAILURE}
    - {from: unit_tests, to: observe_actual, type: ON_FAILURE}
    - {from: lint, to: observe_actual, type: ON_FAILURE}
    - {from: deploy, to: observe_actual, type: ON_FAILURE}
    - {from: shift_traffic, to: observe_actual, type: ON_FAILURE}
    - {from: verify, to: observe_actual, type: ON_FAILURE}

    - {from: observe_actual, to: restore_traffic, type: DEPENDS_ON}
    - {from: restore_traffic, to: rollback, type: DEPENDS_ON}
    - {from: rollback, to: verify_rollback, type: DEPENDS_ON}
    - {from: observe_actual, to: delete_branch, type: DEPENDS_ON}
    - {from: restore_traffic, to: shift_traffic, type: COMPENSATES}
    - {from: rollback, to: deploy, type: COMPENSATES}
    - {from: delete_branch, to: modify_code, type: COMPENSATES}

  # Names usable in expressions.
  aliases:
    deployment: facts.deploy
    checkout: facts.verify

  invariants:
    - {id: tests_green, scope: "checkpoint:ready_to_deploy", expr: 'facts.unit_tests.status == "passed" && facts.lint.status == "passed"'}
    - {id: fix_is_live, expr: "deployment.image == inputs.image"}
    - {id: replica_cap, scope: always, expr: "deployment.replicas <= 50", description: Never run more than 50 replicas}
    - {id: approved_cluster, expr: "deployment.cluster in allowed_clusters", description: allowed_clusters comes from the policy}
    - {id: latency_budget, expr: "checkout.p95_latency < 500ms"}

  commit:
    requires: [verify]
    onViolation: [observe_actual]
