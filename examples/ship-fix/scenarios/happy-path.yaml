apiVersion: soil.dev/v1alpha1
kind: SimScenario
metadata:
  name: happy-path
spec:
  description: "Everything works; the transaction commits only after the SLO check passes."
  expect: COMMITTED
  inputs: {image: "ghcr.io/acme/shop:2.4.1"}
  world:
    repos:
      acme/shop: {defaultBranch: main, headSha: 5be17d0}
    deployments:
      prod/shop/api: {image: "ghcr.io/acme/shop:2.4.0", configVersion: cfg-9, replicas: 3}
    traffic:
      prod/shop/api: {canary: 0}
    http:
      "https://slo.test/shop": {p95_latency: "180ms", error_rate: 0.002, p99_ms: 140}
