[workspace]
resolver = "2"
members = [
    "crates/soil-core",
    "crates/soil-adapters",
    "crates/soil-runtime",
    "crates/soil-cli",
    "crates/soil-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
soil-core = { path = "crates/soil-core" }
soil-adapters = { path = "crates/soil-adapters" }
soil-runtime = { path = "crates/soil-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
